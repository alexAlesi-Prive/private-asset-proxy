# Convenience wrapper around the published image — mirrors the documented
# `docker run` (port 5530, restart policy). Use `docker compose up -d`.
services:
  prive-proxy-assets:
    image: ghcr.io/alexAlesi-Prive/prive-proxy-assets:main
    # To run the locally built image instead of the published one, comment out
    # the `image:` line above and uncomment:
    # build: .
    container_name: prive-proxy-assets
    restart: unless-stopped
    ports:
      - "5530:5530"
    environment:
      PORT: "5530"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5530/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
