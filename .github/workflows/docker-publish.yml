name: Publish container image

# Builds the container image and publishes it to GitHub Container Registry
# (ghcr.io). Pushing to `main` produces the `ghcr.io/<owner>/prive-proxy-assets:main`
# tag used by the deployment commands in the README. Non-main branches build
# (to validate the Dockerfile) but do not push.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image name is fixed to `prive-proxy-assets` (not the repo name) to match the
  # agreed deployment path ghcr.io/<owner>/prive-proxy-assets.
  IMAGE_NAME: ${{ github.repository_owner }}/prive-proxy-assets

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run engine tests (stdlib only)
        run: python -m engine.tests.test_epc_adapter

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Push only for main, tags, or a manual run; other branches build to validate.
          push: >-
            ${{ github.ref == 'refs/heads/main'
                || startsWith(github.ref, 'refs/tags/')
                || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
